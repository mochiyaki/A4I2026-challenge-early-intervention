[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "first-milestones-agent"
version = "1.1.0"
description = "First Milestones — IDEA Part C Early Intervention Triage, Multi-Hop ISO GQL Referral Audit & Multi-Agent ADK Workbench"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.14.0",
    "google-genai>=1.10.0",
    "google-cloud-bigquery>=3.27.0",
    "google-auth>=2.35.0",
    "mcp>=1.8.0",
    "toolbox-core>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["first_milestones*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
